<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <section class="todo-card">
      <h1 class="app-title">Todo List</h1>

      <!-- 날짜 이동 영역 -->
      <div class="date-view-area">
        <button id="prevDateButton" class="date-button" aria-label="이전 날짜">
          &lt;
        </button>

        <div class="date-text-area">
          <p class="date-label">선택된 날짜</p>
          <p id="selectedDateText" class="selected-date-text"></p>
        </div>

        <button id="nextDateButton" class="date-button" aria-label="다음 날짜">
          &gt;
        </button>
      </div>

      <!-- Todo 입력 영역 -->
      <div class="todo-input-area">
        <input 
          type="text" 
          id="todoInput" 
          class="todo-input" 
          placeholder="할 일을 입력하세요"
        >
        <button id="addTodoButton" class="add-button">추가</button>
      </div>

      <!-- 안내 메시지 표시 영역 -->
      <p id="messageText" class="message-text"></p>

      <!-- 상태별 필터 탭 영역 -->
      <div class="filter-tab-area">
        <button class="filter-tab active" data-filter="all">전체</button>
        <button class="filter-tab" data-filter="active">진행 중</button>
        <button class="filter-tab" data-filter="completed">완료</button>
      </div>

      <!-- 저장된 Todo 전체 초기화 버튼 -->
      <button id="clearStorageButton" class="clear-storage-button">
        전체 초기화
      </button>
      
      <!-- Todo 목록 영역 -->
      <ul id="todoList" class="todo-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
